<!DOCTYPE html>
<html>
<head>
  <script>
    function updateBulb() {
      var brightness = document.getElementById('brightness').value
      var temp = document.getElementById('temperature').value;
      var url = '/set?brightness=' + brightness + '&temperature=' + temp;
      fetch(url);
      document.getElementById('brightnessValue').innerText = brightness;
      document.getElementById('tempValue').innerText = temp;
    }
  </script>
 
  <meta name="viewport" content="width=device-width, initial-scale=1">
 
  <style>
    body { font-family: Helvetica; text-align: center; }
    .slider-container { margin: 20px; }
  </style>
</head>
 
<body>
  <h1>Light Bulb Control</h1>
 
  <div class="slider-container">
    <label>Brightness: <span id="brightnessValue">500</span> lumens</label><br>
    <input type="range" id="brightness" min="0" max="1055" value="500" onchange="updateBulb()">
  </div>
 
  <div class="slider-container">
    <label>Temperature: <span id="tempValue">3500</span> K</label><br>
    <input type="range" id="temperature" min="2700" max="10000" value="3500" onchange="updateBulb()">
  </div>
 
</body>
</html>
